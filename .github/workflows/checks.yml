name: Provjera igre
on:
  # PR-ovi se provjeravaju jednom (pull_request); push samo na main kao provjera nakon spajanja.
  # Bez ovoga svaki push na granu PR-a pokreće cijeli skup dvaput.
  push:
    branches: [main]
    paths-ignore: ['**.md', '.claude/**']
  pull_request:
    paths-ignore: ['**.md', '.claude/**']
# Novi push na istu granu otkazuje provedbu koja je već zastarjela.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
  # Browser testovi idu paralelno u 4 dijela (skripte se dijele po rednom broju, pa nova skripta ulazi sama).
  # Zbirni posao "browser" zadržava staro ime provjere i prolazi samo ako prođu svi dijelovi.
  browser-shards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: |
          for t in $(ls tests/browser-*.cjs | sort | awk -v s=${{ matrix.shard }} 'NR % 4 == s % 4'); do
            echo "== $t"
            node "$t" || exit 1
          done
  browser:
    if: always()
    needs: browser-shards
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.browser-shards.result }}" = success
  # Motor Safarija: fontovi, debljine i raspored na veličinama popularnih mobitela. Nije isto što i pravi iPhone, ali hvata razlike motora.
  # Dva dijela uravnotežena po trajanju; zbirni posao "webkit" zadržava staro ime provjere.
  webkit-shards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tests: 'browser-phones browser-safari-effects browser-safari-viewport browser-safari-cloud-recovery browser-ios-gestures browser-ios-invitation-navigation browser-ios-recovery-followup browser-ios-dialogs'
          - tests: 'browser-pyramid-layout browser-ios-duel-expiry browser-ios-input-lifecycle browser-ios-answer-recovery browser-ios-pact-dialog browser-ios-host-invitation browser-ios-multiroom-recovery'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps webkit
      - run: |
          for t in ${{ matrix.tests }}; do
            echo "== $t"
            BROWSER=webkit node "tests/$t.cjs" || exit 1
          done
  webkit:
    if: always()
    needs: webkit-shards
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.webkit-shards.result }}" = success

  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:server
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Check real server with six browser players
        run: |
          npx wrangler dev --local --port 8787 --ip 127.0.0.1 > /tmp/trivia-runtime.log 2>&1 &
          trivia_runtime_pid=$!
          trap 'kill "$trivia_runtime_pid" 2>/dev/null || true' EXIT
          node -e 'async function wait(){for(let i=0;i<60;i++){try{if((await fetch("http://127.0.0.1:8787/api/health")).ok)return;}catch{}await new Promise(r=>setTimeout(r,1000));}throw Error("Runtime did not start");}wait().catch(e=>{console.error(e);process.exit(1)});'
          npm run test:cloud-browser
        env:
          WRANGLER_SEND_METRICS: 'false'
