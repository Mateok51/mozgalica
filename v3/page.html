<title>Mozgalica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@500;700;900&display=swap">
<style>
  /* Raspored: TV je pozornica (naslov gore, sadržaj u sredini, likovi dolje u redu);
     mobitel je kontroler s jednim zadatkom po ekranu. Jedan namjerno tamni izgled. */
  :root {
    --night: #0a1433;
    --stage: #1b2f78;
    --glow: #3b5bdb;
    --surface: rgba(255, 255, 255, 0.10);
    --surface-2: rgba(255, 255, 255, 0.16);
    --line: rgba(255, 255, 255, 0.22);
    --ink: #ffffff;
    --ink-2: #c8d3ff;
    --gold: #ffc93c;
    --gold-deep: #c98a12;
    --red: #e8384f;
    --blue: #2f80ff;
    --yellow: #f7b500;
    --green: #22b573;
    --good: #7dffb4;
    --bad: #ff8a99;
    --ice: #bfe9ff;
    --slime: #79d93b;
    --slime-deep: #3f9a17;
    --font-display: "Luckiest Guy", "Arial Black", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.4;
    color: var(--ink);
    background-color: var(--night);
    background-image:
      radial-gradient(60% 50% at 50% -10%, rgba(255, 201, 60, 0.28), transparent 70%),
      radial-gradient(40% 60% at 0% 100%, rgba(59, 91, 219, 0.55), transparent 70%),
      radial-gradient(40% 60% at 100% 100%, rgba(232, 56, 79, 0.30), transparent 70%),
      linear-gradient(180deg, var(--night), var(--stage));
    background-attachment: fixed;
    padding-block: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
  input { font: inherit; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .screen { min-height: 100%; display: flex; flex-direction: column; gap: 16px; max-width: 1600px; margin: 0 auto; }
  .center { align-items: center; justify-content: center; text-align: center; }
  .logo { font-family: var(--font-display); color: var(--gold); letter-spacing: 0.04em; line-height: 0.95; text-shadow: 0 5px 0 var(--gold-deep), 0 10px 24px rgba(0,0,0,.45); font-size: clamp(2.6rem, 7vw, 5.6rem); }
  .logo small { display: block; margin-top: 12px; font-family: var(--font-body); font-weight: 900; font-size: 0.22em; letter-spacing: 0.3em; color: var(--ink-2); text-shadow: none; }
  .h { font-family: var(--font-display); font-weight: 400; letter-spacing: .03em; line-height: 1.05; margin: 0; text-wrap: balance; }

  .btn { background: var(--gold); color: #2b1a00; font-family: var(--font-display); font-size: 1.3rem; letter-spacing: .04em; padding: .7em 1.5em .6em; border-radius: 18px; box-shadow: 0 6px 0 var(--gold-deep); transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--gold-deep); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn.ghost { background: var(--surface); color: var(--ink); box-shadow: none; border: 2px solid var(--line); font-family: var(--font-body); font-weight: 700; font-size: 1rem; padding: .6em 1.2em; }
  .stack { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 420px; }
  .note { color: var(--ink-2); font-size: .98rem; max-width: 48ch; }
  .err { background: rgba(232,56,79,.22); border: 1px solid var(--red); border-radius: 12px; padding: 10px 14px; font-weight: 700; text-align: left; }
  .pill { display: inline-block; background: var(--surface); border: 1px solid var(--line); padding: .25em .9em; border-radius: 999px; font-weight: 900; color: var(--gold); letter-spacing: .04em; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: clamp(14px, 2.4vw, 28px); }
  .timer { height: 12px; background: rgba(255,255,255,.14); border-radius: 99px; overflow: hidden; }
  .timer > div { height: 100%; width: 100%; background: var(--gold); border-radius: 99px; transition: width .12s linear; }
  .timer.urgent > div { background: var(--red); }
  .o0 { --c: var(--red); } .o1 { --c: var(--blue); } .o2 { --c: var(--yellow); } .o3 { --c: var(--green); }
  .av { display: block; width: 100%; height: auto; }
  .tag { font-size: .8rem; font-weight: 900; letter-spacing: .05em; padding: .15em .55em; border-radius: 99px; background: var(--surface-2); }

  /* ---------- TV ---------- */
  .tv { gap: clamp(10px, 2vh, 22px); }
  .tv-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .tv-top .rl { font-family: var(--font-display); font-size: clamp(1.2rem, 2.2vw, 2rem); color: var(--gold); letter-spacing: .05em; }
  .tv-num { font-family: var(--font-display); font-size: clamp(2rem, 4vw, 3.6rem); color: var(--gold); min-width: 2ch; text-align: right; }
  .tv-mid { flex: 1; display: flex; flex-direction: column; gap: clamp(10px, 2vh, 22px); min-height: 0; }
  .tv-title { font-family: var(--font-display); font-size: clamp(1.8rem, 4.2vw, 4rem); text-align: center; text-wrap: balance; line-height: 1.1; }
  .tv-sub { text-align: center; color: var(--ink-2); font-size: clamp(1rem, 1.8vw, 1.6rem); font-weight: 700; }

  .lineup { display: flex; justify-content: center; align-items: flex-end; gap: clamp(8px, 2vw, 28px); flex-wrap: wrap; padding-top: 6px; }
  .who { width: clamp(70px, 9vw, 130px); display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
  .who.off { opacity: .35; }
  .who .nm { font-weight: 900; font-size: clamp(.85rem, 1.3vw, 1.2rem); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .sc { font-family: var(--font-display); font-size: clamp(.9rem, 1.4vw, 1.3rem); color: var(--gold); font-variant-numeric: tabular-nums; }
  .who .badge { position: absolute; top: -6px; right: -4px; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 99px; background: var(--green); color: #fff; font-weight: 900; display: grid; place-items: center; font-size: .95rem; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .who .badge.gain { background: var(--gold); color: #2b1a00; }
  .who .fxrow { display: flex; gap: 2px; justify-content: center; min-height: 1.4em; font-size: clamp(.9rem, 1.4vw, 1.3rem); }
  .bob { animation: bob 2.4s ease-in-out infinite; }
  .who:nth-child(2n) .bob { animation-delay: -1.2s; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .lobby-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: clamp(14px, 3vw, 36px); flex: 1; }
  .join-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
  .qr { width: min(100%, 320px, 40vh); aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: #fff; }
  .qr svg { display: block; width: 100%; height: 100%; }
  .room-code { font-family: var(--font-display); font-size: clamp(3rem, 8vw, 6.4rem); letter-spacing: .2em; padding-left: .2em; line-height: 1; }
  .lobby-cast { display: flex; flex-direction: column; gap: 16px; justify-content: space-between; min-width: 0; }
  .actions { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; }
  .field-row { display: flex; gap: 8px; width: 100%; }
  .field-row input { flex: 1; min-width: 0; }

  .intro-card { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .intro-card .big { font-family: var(--font-display); font-size: clamp(3.2rem, 11vw, 9rem); color: var(--gold); text-shadow: 0 6px 0 var(--gold-deep), 0 14px 30px rgba(0,0,0,.5); animation: zoom .6s cubic-bezier(.2,1.6,.4,1) both; line-height: 1; }
  .intro-card .sub { font-size: clamp(1.1rem, 2.4vw, 2.2rem); font-weight: 900; color: var(--ink-2); animation: rise .5s .25s both; }
  @keyframes zoom { from { transform: scale(.3) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  .doors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(10px, 2vw, 26px); flex: 1; align-items: end; }
  .door { --c: var(--blue); position: relative; min-height: clamp(180px, 38vh, 420px); border-radius: 999px 999px 18px 18px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 85%, #fff 15%), var(--c)); border: 6px solid rgba(255,255,255,.25); box-shadow: inset 0 -14px 0 rgba(0,0,0,.18), 0 10px 0 rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 10px; gap: 10px; transition: transform .35s, opacity .35s; }
  .door .dn { font-family: var(--font-display); font-size: clamp(1.1rem, 2.3vw, 2.2rem); text-align: center; text-wrap: balance; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .door.o2 .dn { color: #2b1a00; text-shadow: none; }
  .door .knob { position: absolute; right: 14%; top: 58%; width: 14px; height: 14px; border-radius: 50%; background: var(--gold); box-shadow: 0 2px 0 var(--gold-deep); }
  .door .voters { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; min-height: 40px; }
  .door .voters span { width: clamp(28px, 3.2vw, 44px); }
  .door.win { transform: scale(1.06); border-color: #fff; }
  .door.lose { opacity: .25; transform: scale(.94); }

  .powers-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .pw-mini { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .pw-ico { width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 1.6rem; background: var(--surface-2); }
  .pw-mini b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; letter-spacing: .03em; }
  .pw-mini span { color: var(--ink-2); font-size: .85rem; }

  .q-text { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.5rem, 3.6vw, 3.6rem); line-height: 1.15; text-align: center; text-wrap: balance; letter-spacing: .02em; }
  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 16px); }
  .opt { position: relative; display: flex; align-items: center; gap: 12px; background: var(--c); border-radius: 20px; padding: 14px 18px; font-size: clamp(1.05rem, 2.2vw, 2.2rem); font-weight: 900; color: #fff; box-shadow: 0 7px 0 rgba(0,0,0,.28); min-height: clamp(64px, 11vh, 120px); transition: opacity .3s, transform .3s; overflow-wrap: anywhere; }
  .opt.o2 { color: #2b1a00; }
  .opt .shape { font-size: 1.2em; opacity: .85; width: 1.2em; text-align: center; flex: none; }
  .opt .txt { flex: 1; min-width: 0; }
  .opt .cnt { background: rgba(0,0,0,.32); color: #fff; border-radius: 999px; min-width: 1.8em; text-align: center; padding: .1em .5em; font-size: .75em; }
  .opt.dim { opacity: .22; transform: scale(.97); }
  .opt.correct { outline: 6px solid #fff; transform: scale(1.02); }
  .events { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .ev { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px 5px 6px; font-weight: 700; font-size: clamp(.85rem, 1.3vw, 1.2rem); }
  .ev .mini { width: 30px; }
  .ev.blocked { text-decoration: line-through; opacity: .7; }

  .sort-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 2vw, 24px); flex: 1; }
  .sort-col { border-radius: 24px; padding: clamp(12px, 2vw, 24px); display: flex; flex-direction: column; gap: 10px; }
  .sort-col.a { background: color-mix(in srgb, var(--blue) 35%, transparent); border: 3px solid var(--blue); }
  .sort-col.b { background: color-mix(in srgb, var(--red) 35%, transparent); border: 3px solid var(--red); }
  .sort-col h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.4rem, 3vw, 2.8rem); text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { background: rgba(255,255,255,.16); border-radius: 999px; padding: .35em 1em; font-size: clamp(1rem, 1.8vw, 1.7rem); font-weight: 900; animation: rise .35s both; }
  .pairs { display: grid; gap: 10px; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; font-size: clamp(1.05rem, 2vw, 1.9rem); font-weight: 900; }
  .pair > span { background: var(--surface-2); border-radius: 16px; padding: 10px 16px; text-align: center; overflow-wrap: anywhere; }
  .pair .arrow { color: var(--gold); font-family: var(--font-display); background: none; padding: 0; }

  .pyramid { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
  .pstep { position: relative; height: clamp(34px, 6.6vh, 70px); border-radius: 10px 10px 4px 4px; background: linear-gradient(180deg, #e7b45a, #b77b25); box-shadow: inset 0 -6px 0 rgba(0,0,0,.18); display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding: 0 10px; }
  .pstep.top { background: linear-gradient(180deg, #fff3b0, var(--gold)); }
  .pstep .lv { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-family: var(--font-display); color: rgba(60,30,0,.55); font-size: clamp(.9rem, 1.6vw, 1.4rem); }
  .pstep .climber { width: clamp(38px, 4.8vw, 66px); margin-bottom: 2px; position: relative; transition: transform .4s; }
  .pstep .climber .up { position: absolute; top: -10px; right: -10px; background: var(--green); color: #fff; font-weight: 900; border-radius: 99px; padding: 0 6px; font-size: .85rem; }
  .finale-q { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(14px, 3vw, 40px); flex: 1; align-items: center; }
  .tf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .winner { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(14px, 3vw, 40px); align-items: center; flex: 1; }
  .winner .champ { width: min(100%, 320px); margin: 0 auto; animation: zoom .8s cubic-bezier(.2,1.6,.4,1) both; }
  .rank-row { display: flex; align-items: center; gap: 10px; font-size: clamp(1rem, 1.6vw, 1.5rem); font-weight: 700; background: rgba(255,255,255,.08); border-radius: 14px; padding: 6px 12px; }
  .rank-row .pos { width: 1.7em; text-align: center; color: var(--gold); font-family: var(--font-display); }
  .rank-row .mini { width: 34px; flex: none; }
  .rank-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-row .sc { font-variant-numeric: tabular-nums; }
  .scroll { background: linear-gradient(180deg, #fff6d8, #f2dca0); color: #3b2500; border-radius: 18px; padding: 18px 20px; font-weight: 700; box-shadow: 0 8px 0 rgba(0,0,0,.25); }
  .scroll b { display: block; font-family: var(--font-display); font-weight: 400; letter-spacing: .04em; margin-bottom: 6px; color: #7a4a00; }

  /* ---------- mobitel ---------- */
  .phone { max-width: 520px; margin: 0 auto; width: 100%; }
  .p-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 900; }
  .p-me { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .p-me .mini { width: 34px; flex: none; }
  .p-me span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-title { font-family: var(--font-display); font-size: 1.8rem; line-height: 1.1; text-align: center; text-wrap: balance; letter-spacing: .02em; }
  .p-sub { color: var(--ink-2); font-size: 1.02rem; text-align: center; }
  .p-q { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.22; letter-spacing: .02em; text-wrap: balance; }
  .form { display: flex; flex-direction: column; gap: 14px; width: 100%; }
  .form label { display: block; text-align: left; font-weight: 900; color: var(--ink-2); font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  .form input, .field-row input { width: 100%; padding: 13px 16px; border-radius: 14px; border: 2px solid var(--line); background: rgba(255,255,255,.1); color: #fff; font-size: 1.25rem; font-weight: 900; outline: none; }
  .form input:focus, .field-row input:focus { border-color: var(--gold); }
  .form input.code { text-transform: uppercase; letter-spacing: .4em; text-align: center; }
  .av-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .av-pick { background: var(--surface); border: 3px solid transparent; border-radius: 18px; padding: 6px 4px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 900; font-size: .8rem; }
  .av-pick.me { border-color: var(--gold); background: var(--surface-2); }
  .av-pick:disabled { opacity: .3; cursor: not-allowed; }
  .door-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .door-btn { --c: var(--blue); background: var(--c); border-radius: 80px 80px 16px 16px; min-height: 130px; padding: 16px 8px 12px; font-family: var(--font-display); font-size: 1.25rem; letter-spacing: .03em; text-wrap: balance; box-shadow: 0 6px 0 rgba(0,0,0,.28); overflow-wrap: anywhere; }
  .door-btn.o2 { color: #2b1a00; }
  .door-btn.picked { outline: 4px solid #fff; }
  .door-btn:disabled:not(.picked) { opacity: .3; }
  .pw-cards { display: flex; flex-direction: column; gap: 12px; }
  .pw-card { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 12px; }
  .pw-card.atk { border-color: color-mix(in srgb, var(--red) 70%, transparent); }
  .pw-card.buff { border-color: color-mix(in srgb, var(--green) 70%, transparent); }
  .pw-card b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; letter-spacing: .03em; }
  .pw-card span { color: var(--ink-2); font-size: .92rem; }
  .pw-card .pw-ico { width: 56px; height: 56px; font-size: 2rem; }
  .targets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .target { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 900; font-size: .9rem; overflow-wrap: anywhere; }
  .target .mini { width: 64px; }
  .buffs { display: flex; gap: 6px; flex-wrap: wrap; }
  .q-area { position: relative; }
  .p-opts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 11px; }
  .p-opts.two { grid-template-columns: 1fr 1fr; }
  .p-opt { display: flex; align-items: center; gap: 12px; background: var(--c); color: #fff; border-radius: 18px; padding: 14px 16px; font-size: 1.15rem; font-weight: 900; text-align: left; box-shadow: 0 6px 0 rgba(0,0,0,.28); min-height: 64px; transition: transform .08s, opacity .2s; overflow-wrap: anywhere; }
  .p-opt.o2 { color: #2b1a00; }
  .p-opt .shape { font-size: 1.4em; width: 1.2em; text-align: center; opacity: .85; flex: none; }
  .p-opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.28); }
  .p-opt:disabled { cursor: default; }
  .p-opt.dim { opacity: .25; }
  .p-opt.gone { opacity: .12; text-decoration: line-through; }
  .p-opt.picked { outline: 4px solid #fff; }
  .p-opts.two .p-opt { justify-content: center; min-height: 120px; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; letter-spacing: .03em; }
  .waiting { text-align: center; color: var(--ink-2); font-weight: 900; padding: 6px; }
  .result { border-radius: 24px; padding: 22px 16px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .result.ok { background: rgba(34,181,115,.28); border: 2px solid var(--green); }
  .result.bad { background: rgba(232,56,79,.25); border: 2px solid var(--red); }
  .result.none { background: var(--surface); border: 2px solid var(--line); }
  .result .pts { font-family: var(--font-display); font-size: 2.4rem; color: var(--good); }
  .statline { display: flex; gap: 12px; width: 100%; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px; text-align: center; }
  .stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; letter-spacing: .03em; }
  .stat span { color: var(--ink-2); font-size: .78rem; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; }

      const left = Math.max(0, Math.ceil((fx.ends - Date.now()) / 1000));
      return '<div class="fx fx-bomba' + (fx.boom ? ' boom' : '') + '" id="fx">' + label +
        (fx.boom ? '' : '<button class="bomb-btn" id="bomb" aria-label="Odbaci bombu">' + bombSvg + '</button><div class="bomb-num" id="bombnum">' + left + '</div>') + '</div>';
    }
    return '';
  }
  function bindFx() {
    const el = document.getElementById('fx');
    const fx = L.fx;
    if (!el || !fx) return;
    if (fx.k === 'led') {
      el.onpointerdown = (e) => {
        e.preventDefault();
        fx.hits++;
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch (er) {} }
        if (fx.hits >= fx.need) return fxDone();
        el.outerHTML = fxHtml(fx); bindFx();
        const n = document.getElementById('fx'); if (n) n.classList.add('shake');
      };
    } else if (fx.k === 'sluz') {
      const cells = el.querySelectorAll('.cell');
      const wipe = (e) => {
        const r = el.getBoundingClientRect();
        const cx = Math.floor(((e.clientX - r.left) / r.width) * 6), cy = Math.floor(((e.clientY - r.top) / r.height) * 8);
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
          if (Math.abs(dx) + Math.abs(dy) > 1) continue;
          const x = cx + dx, y = cy + dy;
          if (x < 0 || x > 5 || y < 0 || y > 7) continue;
          const i = y * 6 + x;
          if (fx.cells[i]) { fx.cells[i] = 0; fx.left--; if (cells[i]) cells[i].classList.add('gone'); }
        }
        if (fx.left <= 5) fxDone();
      };
      let down = false;
      el.onpointerdown = (e) => { e.preventDefault(); down = true; try { el.setPointerCapture(e.pointerId); } catch (er) {} wipe(e); };
      el.onpointermove = (e) => { if (down) wipe(e); };
      el.onpointerup = el.onpointercancel = () => { down = false; };
    } else if (fx.k === 'grick') {
      el.querySelectorAll('.bug').forEach((b) => {
        b.onpointerdown = (e) => {
          e.preventDefault(); e.stopPropagation();
          fx.bugs[+b.dataset.b].on = false; b.remove();
          if (navigator.vibrate) { try { navigator.vibrate(20); } catch (er) {} }
          if (!fx.bugs.some((x) => x.on)) fxDone();
        };
      });
      el.onpointerdown = (e) => e.preventDefault();
      if (!L.fxTimer) L.fxTimer = setInterval(() => {
        const f = L.fx; if (!f || f.k !== 'grick') return stopFxTimer();
        document.querySelectorAll('.bug').forEach((b) => {
          const bug = f.bugs[+b.dataset.b];
          bug.x = Math.max(8, Math.min(92, bug.x + (Math.random() - 0.5) * 30));
          bug.y = Math.max(10, Math.min(90, bug.y + (Math.random() - 0.5) * 30));
          b.style.left = bug.x + '%'; b.style.top = bug.y + '%';
        });
      }, 700);
    } else if (fx.k === 'bomba') {
      el.onpointerdown = (e) => e.preventDefault();
      const btn = document.getElementById('bomb');
      if (btn) btn.onpointerdown = (e) => {
        e.preventDefault(); e.stopPropagation();
        fx.taps++;
        if (fx.taps >= fx.need) { fx.boom = false; return fxDone(); }
        btn.style.transform = 'scale(' + (1 - fx.taps * 0.12) + ') rotate(' + (fx.taps * 25) + 'deg)';
      };
      if (!L.fxTimer) L.fxTimer = setInterval(() => {
        const f = L.fx; if (!f || f.k !== 'bomba') return stopFxTimer();
        const left = f.ends - Date.now();
        const n = document.getElementById('bombnum');
        if (n) n.textContent = Math.max(0, Math.ceil(left / 1000));
        if (left <= 0 && !f.boom) {
          f.boom = true; stopFxTimer();
          if (navigator.vibrate) { try { navigator.vibrate([80, 40, 120]); } catch (er) {} }
          phoneRender(true);
          setTimeout(() => { if (L.fx === f) fxDone(); }, 900);
        }
      }, 150);
    }
  }

      }
      case 'intro':
        h = center('<div class="p-title" style="font-size:3rem;color:var(--gold)">' + esc(d.it.t) + '</div><div class="p-sub">' + esc(d.it.sub) + '</div><div style="width:130px" class="bob">' + avSvg(me.a, 'happy') + '</div>');
        break;
      case 'vote': {
        const mine = L.sent ? L.sent.v : (me.ok ? -2 : -1);
        h = head + timerHtml() + '<div class="p-title">Glasaj za kategoriju</div><div class="door-btns">' +
          d.cats.map((c, i) => '<button class="door-btn o' + i + (mine === i ? ' picked' : '') + '" data-v="' + i + '"' + (mine !== -1 ? ' disabled' : '') + '>' + esc(c) + '</button>').join('') + '</div>' +
          (mine !== -1 ? '<div class="waiting">Glas zaprimljen ✔</div>' : '');
        break;
      }
      case 'voteResult':
        h = center(head + '<div class="p-sub">Kategorija je</div><div class="p-title" style="color:var(--gold)">' + esc(d.cats[d.cw]) + '</div>');
        break;
      case 'power': h = head + timerHtml() + powerPhone(d, me); break;
      case 'question': h = head + questionPhone(d, me); break;
      case 'reveal': h = head + revealPhone(d, me); break;
      case 'sort': h = head + timerHtml(8000) + sortPhone(d, me); break;
      case 'link': h = head + timerHtml(8000) + linkPhone(d, me); break;
      case 'sortReveal': case 'linkReveal': {
        const tot = d.ph === 'sortReveal' ? d.so.it.length : d.li.L.length;
        h = center(head + '<div class="result ' + (me.k ? 'ok' : 'none') + '"><div class="p-title">Točno ' + me.k + ' od ' + tot + '</div><div class="pts">+' + (me.g || 0) + '</div></div>' + rankStat(d, me));
        break;
      }
      case 'fq': h = head + finalePhone(d, me); break;
      case 'fr': {
        const ok = me.ch === d.cor;
        h = center(head + '<div class="result ' + (ok ? 'ok' : me.ch >= 0 ? 'bad' : 'none') + '"><div class="p-title">' + (ok ? (me.mv === 2 ? 'Najbrži! +2 stepenice' : 'Točno! +1 stepenica') : me.ch >= 0 ? 'Netočno, ostaješ' : 'Prespor!') + '</div>' +
          '<div class="p-sub">Bilo je: <b>' + esc(d.q.o[d.cor]) + '</b></div></div>' + stepMeter(d, me));
        break;
      }
      case 'final': {
        const won = d.win === PID;
        const ranked = d.P.slice().sort((a, b) => (b.st || 0) - (a.st || 0) || b.sc - a.sc);
        const pos = ranked.findIndex((p) => p.id === PID) + 1;
        h = center('<div style="width:150px">' + avSvg(me.a, won ? 'happy' : '') + '</div><div class="p-title" style="font-size:2.4rem;color:var(--gold)">' + (won ? 'Pobijedio si!' : pos + '. mjesto') + '</div>' +
          (won ? '<div class="scroll"><b>Tvoja nagrada: zanimljivost</b>' + esc(d.fact) + '</div>' : '<div class="p-sub">Pobjednik je ' + esc(nameOf(d, d.win)) + '.</div>') +
          '<div class="statline"><div class="stat"><b>' + me.sc + '</b><span>bodova</span></div><div class="stat"><b>' + (me.st || 0) + '/' + d.steps + '</b><span>piramida</span></div></div>' +
          (mode === 'demo' ? '<button class="btn" id="dagain">Igraj opet</button>' : '<div class="p-sub">Domaćin može pokrenuti novu igru.</div>') + '<button class="btn ghost" id="leave">Izađi</button>');
        break;
      }
    }
    $app.innerHTML = demoBar + h;
    bindPhone(d, me);
    tick();
  }

  function rankStat(d, me) {
    const pos = byScore(d.P).findIndex((p) => p.id === PID) + 1;
    return '<div class="statline"><div class="stat"><b>' + pos + '.</b><span>mjesto</span></div><div class="stat"><b>' + me.sc + '</b><span>bodova</span></div></div>';
  }
  function stepMeter(d, me) {
    let bars = '';
    for (let s = 1; s <= d.steps; s++) bars += '<i class="' + ((me.st || 0) >= s ? 'on' : '') + '" style="width:' + (40 + (d.steps - s) * 18) + 'px"></i>';
    return '<div class="step-meter" aria-label="Stepenica ' + (me.st || 0) + ' od ' + d.steps + '">' + bars + '</div><div class="p-sub">Stepenica ' + (me.st || 0) + ' od ' + d.steps + '</div>';
  }

  function powerPhone(d, me) {
    if (L.sent || me.ok) {
      const k = L.sent && L.sent.p;
      return '<div class="result none"><div class="p-title">' + (k ? ICON[k] + ' ' + POWERS[k].n : 'Bez moći') + '</div>' +
        (k && L.sent.t ? '<div class="p-sub">Meta: <b>' + esc(nameOf(d, L.sent.t)) + '</b></div>' : '') + '<div class="waiting">Čekamo ostale…</div></div>';
    }
    if (L.pw) {
      const others = d.P.filter((p) => p.id !== PID && p.c);
      return '<div class="p-title">' + ICON[L.pw] + ' ' + POWERS[L.pw].n + ': na koga?</div><div class="targets">' +
        others.map((p) => '<button class="target" data-t="' + esc(p.id) + '"><span class="mini">' + avSvg(p.a) + '</span>' + esc(p.n) + '<span class="tag">' + p.sc + ' b</span></button>').join('') +
        '</div><button class="btn ghost" id="pwback">Natrag</button>';
    }
    const offers = me.of || [];
    return '<div class="p-title">Odaberi moć</div><div class="pw-cards">' +
      offers.map((k) => '<button class="pw-card ' + (POWERS[k].atk ? 'atk' : 'buff') + '" data-p="' + k + '"><span class="pw-ico">' + ICON[k] + '</span><span><b>' + POWERS[k].n + '</b><span>' + POWERS[k].d + '</span></span></button>').join('') +
      '</div><button class="btn ghost" id="nopw">Preskoči</button>';
  }

  function questionPhone(d, me) {
    const answered = L.sent || me.ok;
    const mine = L.sent ? L.sent.c : -1;
    const hide = me.h || [];
    const buffs = (me.d ? '<span class="tag" style="background:var(--gold);color:#2b1a00">✖️2 Dupli bodovi</span>' : '') + (me.sh ? '<span class="tag">🛡️ Štit</span>' : '') + (hide.length ? '<span class="tag">✂️ Pola-pola</span>' : '');
    const opts = d.q.o.map((o, i) => {
      const gone = hide.includes(i);
      let cls = 'p-opt o' + i + (gone ? ' gone' : '');
      if (answered && !gone) cls += mine === i ? ' picked' : ' dim';
      return '<button class="' + cls + '" data-c="' + i + '"' + (answered || gone ? ' disabled' : '') + '><span class="shape">' + SHAPES[i] + '</span><span>' + esc(o) + '</span></button>';
    }).join('');
    const attackers = (d.ev || []).filter((e) => e.t === PID);
    const hit = attackers.length ? '<div class="p-sub">' + attackers.map((e) => esc(nameOf(d, e.f)) + ' ' + ICON[e.p] + (e.b ? ' (odbijeno)' : '')).join(' · ') + '</div>' : '';
    return timerHtml() + '<div class="p-top"><span class="pill">' + esc(d.q.c) + '</span><span id="tnum"></span></div>' +
      '<div class="p-q">' + esc(d.q.t) + '</div>' + (buffs ? '<div class="buffs">' + buffs + '</div>' : '') + hit +
      '<div class="q-area"><div class="p-opts">' + opts + '</div>' + (answered ? '' : fxHtml(L.fx)) + '</div>' +
      '<div class="waiting">' + (answered ? 'Odgovor zaprimljen ✔' : L.fx ? '' : 'Brže = više bodova!') + '</div>';
  }

  function revealPhone(d, me) {
    const ok = me.ch === d.cor;
    const cls = ok ? 'ok' : me.ch >= 0 ? 'bad' : 'none';
    const title = ok ? 'Točno!' : me.ch >= 0 ? 'Netočno' : 'Vrijeme je isteklo';
    return '<div class="result ' + cls + '"><div style="width:110px">' + avSvg(me.a, ok ? 'happy' : 'dizzy') + '</div><div class="p-title">' + title + '</div>' +
      (ok ? '<div class="pts">+' + me.g + (me.d ? ' (×2)' : '') + '</div>' : '<div class="p-sub">Točan odgovor: <b>' + SHAPES[d.cor] + ' ' + esc(d.q.o[d.cor]) + '</b></div>') + '</div>' + rankStat(d, me);
  }

  function progress(n, done) { let s = ''; for (let i = 0; i < n; i++) s += '<i class="' + (i < done ? 'done' : '') + '"></i>'; return '<div class="progress">' + s + '</div>'; }

  function sortPhone(d, me) {
    const n = d.so.it.length;
    if (L.sent || me.ok || L.sortI >= n) return '<div class="result none"><div class="p-title">Poslano ✔</div><div class="waiting">Čekamo ostale…</div></div>';
    return '<div class="p-title" style="font-size:1.4rem">Gdje pripada?</div>' + progress(n, L.sortI) +
      '<div class="sort-card">' + esc(d.so.it[L.sortI]) + '</div>' +
      '<div class="sort-btns"><button class="sort-btn a" data-s="0">' + esc(d.so.a) + '</button><button class="sort-btn b" data-s="1">' + esc(d.so.b) + '</button></div>';
  }
  function linkPhone(d, me) {
    const n = d.li.L.length;
    if (L.sent || me.ok || L.linkI >= n) return '<div class="result none"><div class="p-title">Poslano ✔</div><div class="waiting">Čekamo ostale…</div></div>';
    return '<div class="p-title" style="font-size:1.4rem">' + esc(d.li.t) + '</div>' + progress(n, L.linkI) +
      '<div class="sort-card">' + esc(d.li.L[L.linkI]) + '</div><div class="link-opts">' +
      d.li.R.map((r, i) => '<button class="link-opt" data-l="' + i + '">' + esc(r) + '</button>').join('') + '</div>';
  }
  function finalePhone(d, me) {
    const answered = L.sent || me.ok;
    const mine = L.sent ? L.sent.c : -1;
    const opts = d.q.o.map((o, i) => '<button class="p-opt o' + (i === 0 ? 3 : 0) + (answered ? (mine === i ? ' picked' : ' dim') : '') + '" data-c="' + i + '"' + (answered ? ' disabled' : '') + '>' + esc(o) + '</button>').join('');
    return timerHtml(3000) + '<div class="p-top"><span class="pill">Finale · stepenica ' + (me.st || 0) + '/' + d.steps + '</span><span id="tnum"></span></div>' +
      '<div class="p-q" style="font-size:1.6rem;text-align:center">' + esc(d.q.t) + '</div><div class="p-opts two">' + opts + '</div>' +
      (answered ? '<div class="waiting">Zaprimljeno ✔</div>' : '');
  }

  function bindPhone(d, me) {
    bind('toTv', () => { demoView = 'tv'; render(); });
    bind('leave', reset);
    bind('dstart', () => game.start());
    bind('dagain', () => { game.restart(); });
    $app.querySelectorAll('[data-av]').forEach((b) => { b.onclick = () => chooseAvatar(+b.dataset.av); });
    $app.querySelectorAll('[data-v]').forEach((b) => { b.onclick = () => { if (!L.sent) sendInput({ v: +b.dataset.v }); }; });
    $app.querySelectorAll('[data-p]').forEach((b) => {
      b.onclick = () => {
        const k = b.dataset.p;
        if (POWERS[k].atk) { L.pw = k; phoneRender(true); } else sendInput({ p: k });
      };
    });
    $app.querySelectorAll('[data-t]').forEach((b) => { b.onclick = () => sendInput({ p: L.pw, t: b.dataset.t }); });
    bind('pwback', () => { L.pw = null; phoneRender(true); });
    bind('nopw', () => sendInput({ p: '' }));
    $app.querySelectorAll('[data-c]').forEach((b) => {
      b.onclick = () => {
        if (L.sent || L.fx) return;
        if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
        sendInput({ c: +b.dataset.c, t: Math.max(0, Math.round(Date.now() - L.start)) });
      };
    });
    $app.querySelectorAll('[data-s]').forEach((b) => {
      b.onclick = () => {
        L.sortR.push(+b.dataset.s); L.sortI++;
        if (L.sortI >= d.so.it.length) sendInput({ r: L.sortR.slice() }); else phoneRender(true);
      };
    });
    $app.querySelectorAll('[data-l]').forEach((b) => {
      b.onclick = () => {
        L.linkR.push(+b.dataset.l); L.linkI++;
        if (L.linkI >= d.li.L.length) sendInput({ r: L.linkR.slice() }); else phoneRender(true);
      };
    });
    if (d.ph === 'question' && L.fx && !(L.sent || (me && me.ok))) bindFx();
  }

  // ---------- odbrojavanje ----------
  function tick() {
    const ms = Math.max(0, clockEnds - Date.now());
    const bar = document.getElementById('tbar'), num = document.getElementById('tnum'), wrap = document.getElementById('timer');
    if (bar && clockDur) bar.style.width = (ms / clockDur * 100) + '%';
    if (num) num.textContent = wrap && clockDur ? Math.ceil(ms / 1000) : '';
    if (wrap) wrap.classList.toggle('urgent', ms <= +(wrap.dataset.u || 5000));
  }
  setInterval(tick, 100);

  if (/^#?[A-Za-z]{4}$/.test(location.hash || '')) mode = 'join';
  render();
})();
</script>
